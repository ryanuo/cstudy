name: Build Qt Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # Windows
  # =========================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        shell: powershell
        run: |
          cmake `
            -S exercises/qt/new-pro `
            -B exercises/qt/new-pro/build `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: powershell
        run: |
          cmake `
            --build exercises/qt/new-pro/build `
            --config Release `
            --parallel

      - name: Deploy Qt
        shell: powershell
        run: |
          windeployqt `
            --release `
            --no-translations `
            exercises/qt/new-pro/build/new-pro.exe

      - name: Package
        shell: powershell
        run: |
          Compress-Archive `
            -Path exercises/qt/new-pro/build/* `
            -DestinationPath new-pro-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-pro-windows
          path: new-pro-windows.zip


  # =========================
  # macOS
  # =========================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          arch: clang_64
          cache: true

      - name: Configure
        run: |
          cmake \
            -S exercises/qt/new-pro \
            -B exercises/qt/new-pro/build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build exercises/qt/new-pro/build \
            --config Release \
            --parallel

      - name: Deploy Qt
        run: |
          macdeployqt \
            exercises/qt/new-pro/build/new-pro.app \
            -qmldir=exercises/qt/new-pro

      - name: Package
        run: |
          cd exercises/qt/new-pro/build
          zip -r ../../../../new-pro-macos.zip new-pro.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-pro-macos
          path: new-pro-macos.zip