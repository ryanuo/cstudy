name: Build Qt Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # Windows
  # ============================================================
  build-windows:

    name: Windows / Qt 6.8.3 / MSVC 2022

    runs-on: windows-2022

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Install Qt
      # --------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true


      # --------------------------------------------------------
      # Show Environment
      # --------------------------------------------------------
      - name: Show Environment
        shell: powershell
        run: |
          Write-Host "Qt installation:"
          Write-Host $env:Qt6_DIR

          Write-Host "CMake:"
          cmake --version

          Write-Host "Compiler:"
          cl


      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------
      - name: Configure CMake
        shell: powershell
        run: |
          cmake `
            -S exercises/qt/new-pro `
            -B exercises/qt/new-pro/build `
            -DCMAKE_BUILD_TYPE=Release


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build
        shell: powershell
        run: |
          cmake `
            --build exercises/qt/new-pro/build `
            --config Release `
            --parallel


      # --------------------------------------------------------
      # Install + Deploy
      # --------------------------------------------------------
      - name: Install
        shell: powershell
        run: |
          cmake `
            --install exercises/qt/new-pro/build `
            --config Release `
            --prefix exercises/qt/new-pro/dist


      # --------------------------------------------------------
      # Check Output
      # --------------------------------------------------------
      - name: List Windows Files
        shell: powershell
        run: |
          Get-ChildItem `
            -Path exercises/qt/new-pro/dist `
            -Recurse


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------
      - name: Package Windows
        shell: powershell
        run: |
          if (Test-Path new-pro-windows-x64.zip) {
            Remove-Item new-pro-windows-x64.zip
          }

          Compress-Archive `
            -Path exercises/qt/new-pro/dist/* `
            -DestinationPath new-pro-windows-x64.zip


      # --------------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------------
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-pro-windows-x64
          path: new-pro-windows-x64.zip


  # ============================================================
  # macOS
  # ============================================================
  build-macos:

    name: macOS 15 / Qt 6.8.3 / Clang

    runs-on: macos-15

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Install Qt
      # --------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          cache: true


      # --------------------------------------------------------
      # Show Environment
      # --------------------------------------------------------
      - name: Show Environment
        run: |
          echo "macOS:"
          sw_vers

          echo "CMake:"
          cmake --version

          echo "Architecture:"
          uname -m

          echo "Qt:"
          qmake --version


      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake \
            -S exercises/qt/new-pro \
            -B exercises/qt/new-pro/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build
        run: |
          cmake \
            --build exercises/qt/new-pro/build \
            --config Release \
            --parallel


      # --------------------------------------------------------
      # Install + Deploy
      # --------------------------------------------------------
      - name: Install
        run: |
          cmake \
            --install exercises/qt/new-pro/build \
            --config Release \
            --prefix exercises/qt/new-pro/dist


      # --------------------------------------------------------
      # Check Output
      # --------------------------------------------------------
      - name: List macOS Files
        run: |
          find exercises/qt/new-pro/dist \
            -maxdepth 5 \
            -print


      # --------------------------------------------------------
      # Check App
      # --------------------------------------------------------
      - name: Check macOS Application
        run: |
          APP="exercises/qt/new-pro/dist/new-pro.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: new-pro.app not found"
            exit 1
          fi

          echo "Application found:"
          ls -la "$APP"

          echo ""
          echo "Executable:"
          ls -la "$APP/Contents/MacOS/"


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------
      - name: Package macOS
        run: |
          cd exercises/qt/new-pro/dist

          zip \
            -r \
            ../../../../new-pro-macos.zip \
            new-pro.app


      # --------------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------------
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-pro-macos
          path: new-pro-macos.zip