<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fafafa" />
<title>OneNET 设备控制面板 · humi_temp</title>

<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>

<style>
:root{
  --background: 0 0% 100%;
  --foreground: 240 10% 3.9%;
  --card: 0 0% 100%;
  --card-foreground: 240 10% 3.9%;
  --primary: 240 5.9% 10%;
  --primary-foreground: 0 0% 98%;
  --secondary: 240 4.8% 95.9%;
  --secondary-foreground: 240 5.9% 10%;
  --muted: 240 4.8% 95.9%;
  --muted-foreground: 240 3.8% 46.1%;
  --accent: 240 4.8% 95.9%;
  --accent-foreground: 240 5.9% 10%;
  --destructive: 0 72% 51%;
  --destructive-foreground: 0 0% 98%;
  --border: 240 5.9% 90%;
  --input: 240 5.9% 90%;
  --ring: 240 5.9% 10%;
  --radius: 0.65rem;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  min-height:100vh;
  background:hsl(240 4.8% 97.5%);
  color:hsl(var(--foreground));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
              "Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}

[v-cloak]{ display:none !important; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:hsl(var(--border)); border-radius:9999px; }
::-webkit-scrollbar-track{ background:transparent; }

.app{ width:100%; max-width:74rem; margin:0 auto; padding:1.25rem 1rem 3rem; }
@media (min-width:640px){ .app{ padding:2rem 1.5rem 4rem; } }

.card{
  background:hsl(var(--card));
  color:hsl(var(--card-foreground));
  border:1px solid hsl(var(--border));
  border-radius:var(--radius);
  box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);
}

/* ---------- Header ---------- */
.header{
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:.875rem; margin-bottom:1.25rem;
}
.header-left{ display:flex; align-items:center; gap:.75rem; min-width:0; }
.logo{
  display:flex; align-items:center; justify-content:center;
  width:2.5rem; height:2.5rem; flex:none;
  border-radius:.75rem;
  background:hsl(var(--primary));
  color:hsl(var(--primary-foreground));
  font-size:1rem;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.header-text{ min-width:0; }
.header-text h1{
  margin:0; font-size:1.0625rem; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.header-text p{
  margin:.2rem 0 0; font-size:.75rem; color:hsl(var(--muted-foreground));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.header-right{ display:flex; align-items:center; gap:.5rem; }

.badge{
  display:inline-flex; align-items:center; gap:.4rem;
  height:2rem; padding:0 .75rem;
  border:1px solid hsl(var(--border));
  border-radius:9999px;
  background:hsl(var(--background));
  font-size:.75rem; font-weight:500; line-height:1;
  white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.dot{ width:.5rem; height:.5rem; border-radius:9999px; flex:none; }
.dot.pulse{ animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

/* ---------- Button ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  height:2.5rem; padding:0 1rem;
  border:1px solid transparent;
  border-radius:calc(var(--radius) - 2px);
  font-family:inherit; font-size:.875rem; font-weight:500; line-height:1;
  white-space:nowrap; cursor:pointer; user-select:none;
  transition:background-color .15s, border-color .15s, color .15s,
             box-shadow .15s, transform .1s, opacity .15s;
}
.btn:focus-visible{ outline:2px solid hsl(var(--ring)); outline-offset:2px; }
.btn:active:not(:disabled){ transform:translateY(1px); }

.btn:disabled,
.btn[disabled]{
  opacity:.45;
  cursor:not-allowed;
  pointer-events:none;
  transform:none !important;
  box-shadow:none;
  filter:grayscale(.35);
}

.btn-outline{
  background:hsl(var(--background));
  border-color:hsl(var(--border));
  color:hsl(var(--foreground));
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.btn-outline:hover:not(:disabled){
  background:hsl(var(--accent));
  color:hsl(var(--accent-foreground));
}

.btn-sm{ height:2rem; padding:0 .75rem; font-size:.8125rem; gap:.4rem; }

/* 语义色按钮 */
.btn-green{ background:#059669; color:#fff; }
.btn-green:hover:not(:disabled){ background:#047857; }

.btn-red{ background:hsl(var(--destructive)); color:hsl(var(--destructive-foreground)); }
.btn-red:hover:not(:disabled){ background:#dc2626; }

.btn-amber{ background:#d97706; color:#fff; }
.btn-amber:hover:not(:disabled){ background:#b45309; }

.btn-blue{ background:#2563eb; color:#fff; }
.btn-blue:hover:not(:disabled){ background:#1d4ed8; }

.btn-slate{
  background:hsl(var(--background));
  border-color:hsl(var(--border));
  color:hsl(var(--foreground));
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.btn-slate:hover:not(:disabled){ background:hsl(var(--accent)); }

/* ---------- 属性卡片 ---------- */
.prop-grid{ display:grid; grid-template-columns:1fr; gap:.875rem; }
@media (min-width:560px){ .prop-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:900px){ .prop-grid{ grid-template-columns:repeat(3,1fr); } }

.prop-card{
  display:flex; flex-direction:column; gap:.875rem;
  padding:1.125rem; text-align:left;
  font:inherit; color:inherit; cursor:pointer;
  transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  -webkit-appearance:none; appearance:none;
}
.prop-card:hover{ transform:translateY(-2px); box-shadow:0 10px 26px -14px rgba(0,0,0,.28); }
.prop-card:active{ transform:translateY(0); }
.prop-card:focus-visible{ outline:2px solid hsl(var(--ring)); outline-offset:2px; }

.prop-head{ display:flex; align-items:center; gap:.75rem; }
.prop-icon{
  display:flex; align-items:center; justify-content:center;
  width:2.25rem; height:2.25rem; flex:none;
  border-radius:.625rem; font-size:.9375rem;
}
.prop-title{ flex:1; min-width:0; }
.prop-name{
  display:block; font-size:.8125rem; font-weight:500;
  color:hsl(var(--muted-foreground));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.prop-arrow{
  font-size:.875rem; color:hsl(var(--muted-foreground));
  opacity:0; transform:translateX(-3px);
  transition:opacity .18s ease, transform .18s ease;
}
.prop-card:hover .prop-arrow{ opacity:1; transform:translateX(0); }
@media (hover:none){ .prop-arrow{ opacity:.45; transform:none; } }

.prop-value{
  display:flex; align-items:baseline; gap:.25rem;
  font-size:1.75rem; font-weight:600;
  letter-spacing:-.025em; line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.prop-value small{
  font-size:.8125rem; font-weight:400;
  color:hsl(var(--muted-foreground)); letter-spacing:0;
}

/* ---------- 控制区 ---------- */
.controls{
  display:grid; grid-template-columns:1fr; gap:.875rem; margin-top:.875rem;
}
@media (min-width:640px){ .controls{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:1024px){ .controls{ grid-template-columns:repeat(3,1fr); } }

.control-card{ display:flex; flex-direction:column; gap:1rem; padding:1.125rem; }
@media (min-width:640px){ .control-card{ padding:1.25rem; } }

.control-head{ display:flex; align-items:center; gap:.75rem; }
.control-icon{
  display:flex; align-items:center; justify-content:center;
  width:2.25rem; height:2.25rem; flex:none;
  border-radius:.625rem;
  background:hsl(var(--muted)); color:hsl(var(--muted-foreground));
  font-size:.9375rem;
}
.control-title{ margin:0; font-size:.875rem; font-weight:600; }
.control-sub{ margin:.2rem 0 0; font-size:.6875rem; color:hsl(var(--muted-foreground)); }

.btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:.625rem; }

.tip-area{
  min-height:1.25rem;
  display:flex; align-items:center; justify-content:center;
}
.tip-ok{
  display:inline-flex; align-items:center; gap:.35rem;
  font-size:.75rem; font-weight:500; color:#059669;
}
.tip-warn{
  display:inline-flex; align-items:center; gap:.35rem;
  font-size:.75rem; font-weight:500; color:#d97706;
}

.footer-note{
  margin-top:1.5rem; text-align:center;
  font-size:.6875rem; color:hsl(var(--muted-foreground));
}

/* ---------- Dialog ---------- */
.overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:.875rem;
  background:rgba(9,9,11,.55);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
}
@media (min-width:640px){ .overlay{ padding:1.5rem; } }

.dialog{
  display:flex; flex-direction:column;
  width:100%; max-width:42rem; max-height:90vh;
  background:hsl(var(--card));
  border:1px solid hsl(var(--border));
  border-radius:var(--radius);
  box-shadow:0 24px 48px -12px rgba(0,0,0,.3);
  overflow:hidden;
  animation:dialog-in .2s cubic-bezier(.16,1,.3,1);
}
@keyframes dialog-in{
  from{ opacity:0; transform:translateY(10px) scale(.975); }
  to{ opacity:1; transform:none; }
}

.dialog-head{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:.875rem 1rem; border-bottom:1px solid hsl(var(--border));
}
@media (min-width:640px){ .dialog-head{ padding:1rem 1.25rem; } }

.dialog-title{ margin:0; font-size:.9375rem; font-weight:600; letter-spacing:-.01em; }
.dialog-sub{ margin:.2rem 0 0; font-size:.6875rem; color:hsl(var(--muted-foreground)); }

.dialog-close{
  display:flex; align-items:center; justify-content:center;
  width:2rem; height:2rem; flex:none;
  border:none; border-radius:calc(var(--radius) - 4px);
  background:transparent; color:hsl(var(--muted-foreground));
  font-size:.9375rem; cursor:pointer;
  transition:background-color .15s, color .15s;
}
.dialog-close:hover{ background:hsl(var(--accent)); color:hsl(var(--accent-foreground)); }
.dialog-close:focus-visible{ outline:2px solid hsl(var(--ring)); outline-offset:2px; }

.dialog-body{ padding:1rem; overflow-y:auto; -webkit-overflow-scrolling:touch; }
@media (min-width:640px){ .dialog-body{ padding:1.25rem; } }

.chart-wrap{ position:relative; }
.chart{ width:100%; height:280px; }
@media (min-width:640px){ .chart{ height:360px; } }

.chart-mask{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.5rem;
  background:rgba(255,255,255,.86);
  border-radius:calc(var(--radius) - 2px);
  font-size:.8125rem; color:hsl(var(--muted-foreground));
}
.chart-mask i{ font-size:1.125rem; }

.fade-enter-active,.fade-leave-active{ transition:opacity .18s ease; }
.fade-enter-from,.fade-leave-to{ opacity:0; }

.hide-xs{ display:none; }
@media (min-width:480px){ .hide-xs{ display:inline; } }
</style>
</head>

<body>
<div id="app" v-cloak class="app">

  <!-- ============ 顶部 ============ -->
  <header class="header">
    <div class="header-left">
      <div class="logo"><i class="fa fa-microchip"></i></div>
      <div class="header-text">
        <h1>OneNET 设备控制面板</h1>
        <p>{{ deviceName }} · {{ productId }}</p>
      </div>
    </div>

    <div class="header-right">
      <span class="badge">
        <span class="dot" :class="{ pulse: online === true }" :style="{ backgroundColor: statusColor }"></span>
        <span :style="{ color: statusColor }">{{ statusText }}</span>
      </span>

      <button type="button" class="btn btn-outline btn-sm" :disabled="refreshing" @click="refreshAll">
        <i class="fa fa-refresh" :class="{ 'fa-spin': refreshing }"></i>
        <span class="hide-xs">刷新</span>
      </button>
    </div>
  </header>

  <!-- ============ 属性卡片（温度 / 湿度 / LED） ============ -->
  <section class="prop-grid">
    <button
      v-for="card in cards"
      :key="card.id"
      type="button"
      class="card prop-card"
      @click="openHistory(card)">
      <div class="prop-head">
        <span class="prop-icon"
              :style="{ backgroundColor: hexA(card.color, .12), color: card.color }">
          <i class="fa" :class="card.icon"></i>
        </span>
        <span class="prop-title">
          <span class="prop-name">{{ card.name }}</span>
        </span>
        <i class="fa fa-angle-right prop-arrow"></i>
      </div>
      <div class="prop-value">
        <span>{{ displayValue(card) }}</span>
        <small v-if="card.unit">{{ card.unit }}</small>
      </div>
    </button>
  </section>

  <!-- ============ 控制区：LED / 蜂鸣器 / 风扇 ============ -->
  <section class="controls">

    <!-- LED 控制 -->
    <div class="card control-card">
      <div class="control-head">
        <span class="control-icon"
              :style="ledOn ? { backgroundColor:'rgba(217,119,6,.12)', color:'#d97706' } : {}">
          <i class="fa fa-lightbulb-o"></i>
        </span>
        <div style="flex:1;min-width:0;">
          <h2 class="control-title">LED 灯光控制</h2>
          <p class="control-sub">下发 LED 属性（字符串）</p>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-amber"
                :disabled="!online" @click="setLed(LED_ON)">
          <i class="fa fa-sun-o"></i> 开灯
        </button>
        <button type="button" class="btn btn-slate"
                :disabled="!online" @click="setLed(LED_OFF)">
          <i class="fa fa-moon-o"></i> 关灯
        </button>
      </div>

      <div class="tip-area">
        <transition name="fade">
          <span v-if="tip.led" class="tip-ok"><i class="fa fa-check-circle"></i> 已执行</span>
        </transition>
        <transition name="fade">
          <span v-if="!online" class="tip-warn"><i class="fa fa-exclamation-circle"></i> 设备离线，不可控制</span>
        </transition>
      </div>
    </div>

    <!-- 蜂鸣器控制 -->
    <div class="card control-card">
      <div class="control-head">
        <span class="control-icon"
              :style="buzzerOn ? { backgroundColor:'rgba(220,38,38,.12)', color:'#dc2626' } : {}">
          <i class="fa fa-bell-o"></i>
        </span>
        <div style="flex:1;min-width:0;">
          <h2 class="control-title">蜂鸣器控制</h2>
          <p class="control-sub">下发 buzzer 属性（布尔）</p>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-red"
                :disabled="!online" @click="setBuzzer(true)">
          <i class="fa fa-bell"></i> 开启
        </button>
        <button type="button" class="btn btn-slate"
                :disabled="!online" @click="setBuzzer(false)">
          <i class="fa fa-bell-slash-o"></i> 关闭
        </button>
      </div>

      <div class="tip-area">
        <transition name="fade">
          <span v-if="tip.buzzer" class="tip-ok"><i class="fa fa-check-circle"></i> 已执行</span>
        </transition>
        <transition name="fade">
          <span v-if="!online" class="tip-warn"><i class="fa fa-exclamation-circle"></i> 设备离线，不可控制</span>
        </transition>
      </div>
    </div>

    <!-- 风扇控制 -->
    <div class="card control-card">
      <div class="control-head">
        <span class="control-icon"
              :style="fanOn ? { backgroundColor:'rgba(37,99,235,.12)', color:'#2563eb' } : {}">
          <i class="fa fa-snowflake-o"></i>
        </span>
        <div style="flex:1;min-width:0;">
          <h2 class="control-title">风扇控制</h2>
          <p class="control-sub">下发 fan 属性（布尔）</p>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-blue"
                :disabled="!online" @click="setFan(true)">
          <i class="fa fa-play"></i> 开启
        </button>
        <button type="button" class="btn btn-slate"
                :disabled="!online" @click="setFan(false)">
          <i class="fa fa-stop"></i> 关闭
        </button>
      </div>

      <div class="tip-area">
        <transition name="fade">
          <span v-if="tip.fan" class="tip-ok"><i class="fa fa-check-circle"></i> 已执行</span>
        </transition>
        <transition name="fade">
          <span v-if="!online" class="tip-warn"><i class="fa fa-exclamation-circle"></i> 设备离线，不可控制</span>
        </transition>
      </div>
    </div>

  </section>

  <p class="footer-note">数据每 10 秒自动刷新 · 点击属性卡片查看历史曲线</p>

  <!-- ============ 历史数据弹窗 ============ -->
  <transition name="fade">
    <div v-if="hist.open" class="overlay" @click.self="closeHistory">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <div style="min-width:0;">
            <h3 class="dialog-title">{{ hist.title }} · 历史数据</h3>
            <p class="dialog-sub">最近 24 小时</p>
          </div>
          <button type="button" class="dialog-close" @click="closeHistory" aria-label="关闭">
            <i class="fa fa-times"></i>
          </button>
        </div>

        <div class="dialog-body">
          <div class="chart-wrap">
            <div id="historyChart" class="chart"></div>
            <div v-if="hist.loading || hist.empty" class="chart-mask">
              <i class="fa" :class="hist.loading ? 'fa-spinner fa-spin' : 'fa-inbox'"></i>
              <span>{{ hist.loading ? '正在加载…' : hist.emptyText }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </transition>

</div>

<script>
const { createApp, ref, reactive, computed, nextTick, onMounted, onBeforeUnmount } = Vue;

/* =========================================================
   配置（已适配你的设备）
   ========================================================= */
const config = {
  token: 'version=2018-10-31&res=products%2FWW0f6843I6%2Fdevices%2Fhumi_temp&et=1822562760&method=sha1&sign=o3KQXG0XbEBbJZBHkyfXDpzSIHQ%3D',
  productId: 'WW0f6843I6',
  deviceName: 'humi_temp',
  api: {
    deviceDetail: 'https://iot-api.heclouds.com/device/detail',
    getProperty:  'https://iot-api.heclouds.com/thingmodel/query-device-property',
    setProperty:  'https://iot-api.heclouds.com/thingmodel/set-device-property',
    getHistory:   'https://iot-api.heclouds.com/thingmodel/query-device-property-history'
  }
};

/* ---------------------------------------------------------
   属性下发时的取值约定
   - LED 为字符串型：'on' / 'off'（设备端若用 "1"/"0" 改这里）
   - buzzer / fan 为布尔型：true / false
   如与实际物模型不符，只需修改下面 4 个常量
--------------------------------------------------------- */
const LED_ON      = 'on';
const LED_OFF     = 'off';
const BUZZER_ON   = true;
const BUZZER_OFF  = false;
const FAN_ON      = true;
const FAN_OFF     = false;

/* 属性卡片（温度 / 湿度 / LED）—— CO2 与 key 已移除 */
const CARDS = [
  { id:'temperature', name:'温度', unit:'℃',   type:'float',  icon:'fa-thermometer-half', color:'#3b82f6' },
  { id:'humidity',    name:'湿度', unit:'%RH', type:'float',  icon:'fa-tint',             color:'#10b981' },
  { id:'LED',         name:'LED',  unit:'',    type:'string', icon:'fa-lightbulb-o',      color:'#8b5cf6' }
];

createApp({
  setup() {
    /* ---------- 状态 ---------- */
    const online     = ref(null);
    const refreshing = ref(false);

    // 三个控制项的“已执行”提示
    const tip = reactive({ led:false, buzzer:false, fan:false });

    // 从云端读取到的当前值
    const state = reactive({
      temperature: null,
      humidity:    null,
      LED:         null,
      buzzer:      null,   // 若物模型中没有该标识符，则保持 null
      fan:         null
    });

    const hist = reactive({
      open:false, loading:false, empty:false,
      emptyText:'暂无历史数据',
      title:'', unit:'', color:'#3b82f6', id:''
    });

    let chart = null;
    const timers = { led:null, buzzer:null, fan:null };
    let pollTimer = null, reqId = 0;

    /* ---------- 计算属性 ---------- */
    const statusText = computed(() =>
      online.value === null ? '检测中' : (online.value ? '在线' : '离线')
    );
    const statusColor = computed(() =>
      online.value === null ? '#f59e0b' : (online.value ? '#10b981' : '#f43f5e')
    );

    const ledOn = computed(() => {
      const v = state.LED;
      if (v === null || v === undefined) return false;
      return v === LED_ON || v === '1' || v === 1 || v === true || v === 'true';
    });
    const buzzerOn = computed(() => state.buzzer === true || state.buzzer === 'true' || state.buzzer === 1);
    const fanOn    = computed(() => state.fan    === true || state.fan    === 'true' || state.fan    === 1);

    /* ---------- 工具 ---------- */
    function hexA(hex, a) {
      const h = hex.replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      return await res.json();
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    /* ---------- 1. 设备在线状态 ---------- */
    async function refreshStatus() {
      try {
        const data = await fetchJson(
          `${config.api.deviceDetail}?product_id=${config.productId}&device_name=${config.deviceName}`,
          { headers: { authorization: config.token } }
        );
        if (data && data.code === 0 && data.data) {
          online.value = Number(data.data.status) === 1;
        } else {
          online.value = false;
          console.warn('[设备状态]', data && data.msg);
        }
      } catch (err) {
        console.error('[设备状态] 请求失败：', err);
        online.value = false;
      }
    }

    /* ---------- 2. 拉取属性值 ---------- */
    async function refreshProperties() {
      try {
        const data = await fetchJson(
          `${config.api.getProperty}?product_id=${config.productId}&device_name=${config.deviceName}`,
          { headers: { authorization: config.token } }
        );
        if (!data || data.code !== 0) {
          console.warn('[属性]', data && data.msg);
          return;
        }
        const list = Array.isArray(data.data) ? data.data : [];
        list.forEach(item => {
          if (Object.prototype.hasOwnProperty.call(state, item.identifier)) {
            state[item.identifier] = item.value;
          }
        });
      } catch (err) {
        console.error('[属性] 请求失败：', err);
      }
    }

    async function refreshAll() {
      if (refreshing.value) return;
      refreshing.value = true;
      await Promise.allSettled([refreshStatus(), refreshProperties()]);
      refreshing.value = false;
    }

    /* ---------- 卡片数值展示 ---------- */
    function displayValue(card) {
      const raw = state[card.id];
      if (raw === null || raw === undefined || raw === '') return '--';
      if (card.type === 'string') return String(raw);
      const n = Number(raw);
      if (isNaN(n)) return String(raw);
      return card.type === 'int' ? String(Math.round(n)) : n.toFixed(1);
    }

    /* ---------- 下发（离线拦截） ---------- */
    function sendProperty(params) {
      if (!online.value) {
        console.warn('[下发指令] 设备离线，已阻止下发');
        return;
      }
      fetch(config.api.setProperty, {
        method: 'POST',
        headers: {
          authorization: config.token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          product_id: config.productId,
          device_name: config.deviceName,
          params
        })
      }).catch(err => console.error('[下发指令] 失败：', err));
    }

    /* 通用：显示“已执行”2 秒 */
    function flashTip(key) {
      tip[key] = true;
      clearTimeout(timers[key]);
      timers[key] = setTimeout(() => { tip[key] = false; }, 2000);
    }

    /* ---------- 3. LED 控制 ---------- */
    function setLed(value) {
      if (!online.value) return;
      flashTip('led');
      sendProperty({ LED: value });
    }

    /* ---------- 4. 蜂鸣器控制 ---------- */
    function setBuzzer(value) {
      if (!online.value) return;
      flashTip('buzzer');
      sendProperty({ buzzer: value });
    }

    /* ---------- 5. 风扇控制 ---------- */
    function setFan(value) {
      if (!online.value) return;
      flashTip('fan');
      sendProperty({ fan: value });
    }

    /* ---------- 6. 历史数据 ---------- */
    function handleResize() { if (chart) chart.resize(); }

    async function openHistory(card) {
      const my = ++reqId;

      hist.open      = true;
      hist.id        = card.id;
      hist.title     = card.name;
      hist.unit      = card.unit;
      hist.color     = card.color;
      hist.empty     = false;
      hist.emptyText = '暂无历史数据';
      hist.loading   = true;

      await nextTick();

      const el = document.getElementById('historyChart');
      if (!el) { hist.loading = false; return; }

      if (chart) { chart.dispose(); chart = null; }
      chart = echarts.init(el);
      window.removeEventListener('resize', handleResize);
      window.addEventListener('resize', handleResize);

      try {
        const end   = Date.now();
        const start = end - 24 * 60 * 60 * 1000;
        const url = `${config.api.getHistory}?product_id=${config.productId}`
                  + `&device_name=${config.deviceName}`
                  + `&identifier=${encodeURIComponent(card.id)}`
                  + `&start_time=${start}&end_time=${end}&limit=100`;

        const data = await fetchJson(url, { headers: { authorization: config.token } });
        if (my !== reqId) return;

        if (!data || data.code !== 0) {
          throw new Error((data && data.msg) || '获取历史数据失败');
        }

        const raw  = (data.data && data.data.list) || [];
        const list = raw
          .map(it => ({ t: Number(it.time), v: it.value }))
          .filter(it => !isNaN(it.t))
          .sort((a, b) => a.t - b.t);

        hist.loading = false;

        if (!list.length) {
          hist.empty = true;
          hist.emptyText = '暂无历史数据';
          chart.clear();
          return;
        }

        renderChart(list, card);
      } catch (err) {
        if (my !== reqId) return;
        console.error('[历史数据] 请求失败：', err);
        hist.loading = false;
        hist.empty = true;
        hist.emptyText = '历史数据加载失败';
        chart.clear();
      }
    }

    function renderChart(list, card) {
      const isNum = v =>
        v !== '' && v !== null && v !== undefined &&
        typeof v !== 'boolean' && !isNaN(Number(v));

      const numeric = list.every(it => isNum(it.v));

      const times  = list.map(it => fmtTime(it.t));
      const values = numeric ? list.map(it => Number(it.v)) : list.map(it => String(it.v));

      chart.setOption({
        grid: { left: 4, right: 16, top: 26, bottom: 4, containLabel: true },
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(255,255,255,.97)',
          borderColor: '#e4e4e7',
          borderWidth: 1,
          padding: [8, 12],
          textStyle: { color: '#18181b', fontSize: 12 },
          valueFormatter: v =>
            (v === null || v === undefined ? '--' : v) + (card.unit ? ' ' + card.unit : '')
        },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: times,
          axisLine: { lineStyle: { color: '#e4e4e7' } },
          axisTick: { show: false },
          axisLabel: { color: '#a1a1aa', fontSize: 11, hideOverlap: true }
        },
        yAxis: {
          type: numeric ? 'value' : 'category',
          scale: numeric,
          name: card.unit || '',
          nameTextStyle: { color: '#a1a1aa', fontSize: 11 },
          splitLine: { lineStyle: { color: '#f4f4f5' } },
          axisLabel: { color: '#a1a1aa', fontSize: 11 },
          axisLine: { show: false },
          axisTick: { show: false }
        },
        series: [{
          name: card.name,
          type: 'line',
          smooth: numeric,
          showSymbol: list.length <= 30,
          symbolSize: 6,
          data: values,
          lineStyle: { width: 2, color: card.color },
          itemStyle: { color: card.color },
          areaStyle: numeric ? {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: hexA(card.color, .28) },
              { offset: 1, color: hexA(card.color, .02) }
            ])
          } : undefined
        }]
      }, true);

      chart.resize();
    }

    function closeHistory() {
      hist.open = false;
      reqId++;
      if (chart) { chart.dispose(); chart = null; }
      window.removeEventListener('resize', handleResize);
    }

    function onKeydown(e) {
      if (e.key === 'Escape' && hist.open) closeHistory();
    }

    /* ---------- 生命周期 ---------- */
    onMounted(() => {
      refreshAll();
      pollTimer = setInterval(refreshAll, 10000);
      window.addEventListener('keydown', onKeydown);
    });

    onBeforeUnmount(() => {
      clearInterval(pollTimer);
      clearTimeout(timers.led);
      clearTimeout(timers.buzzer);
      clearTimeout(timers.fan);
      window.removeEventListener('keydown', onKeydown);
      window.removeEventListener('resize', handleResize);
      if (chart) { chart.dispose(); chart = null; }
    });

    return {
      cards: CARDS,
      deviceName: config.deviceName,
      productId: config.productId,
      LED_ON, LED_OFF,

      online, statusText, statusColor,
      refreshing, refreshAll,

      state, displayValue, hexA,
      ledOn, buzzerOn, fanOn,

      tip, setLed, setBuzzer, setFan,

      hist, openHistory, closeHistory
    };
  }
}).mount('#app');
</script>
</body>
</html>
