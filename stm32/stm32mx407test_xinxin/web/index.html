<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fafafa" />
<title>OneNET 设备控制面板 · humi_temp</title>

<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>

<link rel="stylesheet" href="style.css" />

</head>

<body>
<div id="app" v-cloak class="app">

  <!-- ============ 顶部 ============ -->
  <header class="header">
    <div class="header-left">
      <div class="logo"><i class="fa fa-microchip"></i></div>
      <div class="header-text">
        <h1>OneNET 设备控制面板</h1>
        <p>{{ deviceName }} · {{ productId }}</p>
      </div>
    </div>

    <div class="header-right">
      <span class="badge">
        <span class="dot" :class="{ pulse: online === true }" :style="{ backgroundColor: statusColor }"></span>
        <span :style="{ color: statusColor }">{{ statusText }}</span>
      </span>

      <button type="button" class="btn btn-outline btn-sm" :disabled="refreshing" @click="refreshAll">
        <i class="fa fa-refresh" :class="{ 'fa-spin': refreshing }"></i>
        <span class="hide-xs">刷新</span>
      </button>
    </div>
  </header>

  <!-- ============ 属性卡片（温度 / 湿度） ============ -->
  <section class="prop-grid">
    <button
      v-for="card in cards"
      :key="card.id"
      type="button"
      class="card prop-card"
      @click="openHistory(card)">
      <div class="prop-head">
        <span class="prop-icon"
              :style="{ backgroundColor: hexA(card.color, .12), color: card.color }">
          <i class="fa" :class="card.icon"></i>
        </span>
        <span class="prop-title">
          <span class="prop-name">{{ card.name }}</span>
        </span>
        <i class="fa fa-angle-right prop-arrow"></i>
      </div>
      <div class="prop-value">
        <span>{{ displayValue(card) }}</span>
        <small v-if="card.unit">{{ card.unit }}</small>
      </div>
    </button>
  </section>

  <!-- ============ 控制区：单开关切换 ============ -->
  <section class="controls">
    <div v-for="c in controls" :key="c.key" class="card control-card">

      <button
        type="button"
        class="switch-btn"
        :class="{ on: controlOn[c.key] }"
        :style="controlOn[c.key]
          ? { borderColor: hexA(c.color, .45), backgroundColor: hexA(c.color, .05) }
          : {}"
        :disabled="!online"
        :aria-pressed="controlOn[c.key] ? 'true' : 'false'"
        @click="toggleControl(c)">

        <span class="sw-left">
          <span class="sw-icon"
                :style="controlOn[c.key]
                  ? { backgroundColor: hexA(c.color, .14), color: c.color }
                  : {}">
            <i class="fa" :class="c.icon"></i>
          </span>
          <span class="sw-text">
            <span class="sw-title">{{ c.name }}</span>
            <span class="sw-sub">
              {{ !online ? '设备离线，不可控制' : (controlOn[c.key] ? '已开启' : '已关闭') }}
            </span>
          </span>
        </span>

        <span class="sw-track"
              :style="controlOn[c.key] ? { backgroundColor: c.color } : {}">
          <span class="sw-thumb"></span>
        </span>
      </button>

      <div class="tip-area">
        <transition name="fade">
          <span v-if="tip[c.key]" class="tip-ok">
            <i class="fa fa-check-circle"></i> 指令已下发
          </span>
        </transition>
        <transition name="fade">
          <span v-if="tipErr[c.key]" class="tip-err">
            <i class="fa fa-exclamation-circle"></i> 下发失败（物模型里有这个属性吗？）
          </span>
        </transition>
      </div>

    </div>
  </section>

  <p class="footer-note">数据每 10 秒自动刷新 · 下发后自动回读状态 · 点击属性卡片查看历史曲线</p>

  <!-- ============ 历史数据弹窗 ============ -->
  <transition name="fade">
    <div v-if="hist.open" class="overlay" @click.self="closeHistory">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <div style="min-width:0;">
            <h3 class="dialog-title">{{ hist.title }} · 历史数据</h3>
            <p class="dialog-sub">最近 24 小时</p>
          </div>
          <button type="button" class="dialog-close" @click="closeHistory" aria-label="关闭">
            <i class="fa fa-times"></i>
          </button>
        </div>

        <div class="dialog-body">
          <div class="chart-wrap">
            <div id="historyChart" class="chart"></div>
            <div v-if="hist.loading || hist.empty" class="chart-mask">
              <i class="fa" :class="hist.loading ? 'fa-spinner fa-spin' : 'fa-inbox'"></i>
              <span>{{ hist.loading ? '正在加载…' : hist.emptyText }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </transition>

</div>

<script src="app.js"></script>

</body>
</html>
