<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fafafa" />
<title>OneNET 设备控制面板 · humi_temp</title>

<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>

<link rel="stylesheet" href="style.css" />
<script src="config.js"></script>   <!-- 同源 API 封装（设备 token 在后端） -->

</head>

<body>
<div id="app" v-cloak class="app">

  <!-- ============ 顶部 ============ -->
  <header class="header">
    <div class="header-left">
      <div class="logo"><i class="fa fa-microchip"></i></div>
      <div class="header-text">
        <h1>OneNET 设备控制面板</h1>
        <p>{{ deviceName }} · {{ productId }}</p>
      </div>
    </div>

    <div class="header-right">
      <span class="badge">
        <span class="dot" :class="{ pulse: online === true }" :style="{ backgroundColor: statusColor }"></span>
        <span :style="{ color: statusColor }">{{ statusText }}</span>
      </span>

      <button type="button" class="btn btn-outline btn-sm btn-danger"
              :disabled="!online || rebooting"
              :title="online ? '重启设备（复位 MCU）' : '设备离线，不可重启'"
              @click="onRebootClick">
        <i class="fa" :class="rebooting ? 'fa-spinner fa-spin' : 'fa-power-off'"></i>
        <span class="hide-xs">{{ rebootArm ? '再点一次确认' : '重启设备' }}</span>
      </button>

      <button type="button" class="btn btn-outline btn-sm" :disabled="refreshing" @click="refreshAll">
        <i class="fa fa-refresh" :class="{ 'fa-spin': refreshing }"></i>
        <span class="hide-xs">刷新</span>
      </button>
    </div>
  </header>

  <p id="voiceBar" class="voice-bar" role="status" aria-live="polite" hidden>
    <i class="fa fa-microphone" id="voiceIcon"></i><span id="voiceText"></span>
  </p>

  <p v-if="rebootMsg" class="reboot-note">
    <i class="fa fa-info-circle"></i> {{ rebootMsg }}
  </p>

  <!-- ============ 属性卡片（温度 / 湿度） ============ -->
  <section class="prop-grid">
    <button
      v-for="card in cards"
      :key="card.id"
      type="button"
      class="card prop-card"
      @click="openHistory(card)">
      <div class="prop-head">
        <span class="prop-icon"
              :style="{ backgroundColor: hexA(card.color, .12), color: card.color }">
          <i class="fa" :class="card.icon"></i>
        </span>
        <span class="prop-title">
          <span class="prop-name">{{ card.name }}</span>
        </span>
        <i class="fa fa-angle-right prop-arrow"></i>
      </div>
      <div class="prop-value">
        <span>{{ displayValue(card) }}</span>
        <small v-if="card.unit">{{ card.unit }}</small>
      </div>
    </button>
  </section>

  <!-- ============ 控制区：单开关切换 ============ -->
  <section class="controls">
    <div v-for="c in controls" :key="c.key" class="card control-card">

      <button
        type="button"
        class="switch-btn"
        :class="{ on: controlOn[c.key] }"
        :style="controlOn[c.key]
          ? { borderColor: hexA(c.color, .45), backgroundColor: hexA(c.color, .05) }
          : {}"
        :disabled="!online"
        :aria-pressed="controlOn[c.key] ? 'true' : 'false'"
        @click="toggleControl(c)">

        <span class="sw-left">
          <span class="sw-icon"
                :style="controlOn[c.key]
                  ? { backgroundColor: hexA(c.color, .14), color: c.color }
                  : {}">
            <i class="fa" :class="c.icon"></i>
          </span>
          <span class="sw-text">
            <span class="sw-title">{{ c.name }}</span>
            <span class="sw-sub">
              {{ !online ? '设备离线，不可控制' : (controlOn[c.key] ? '已开启' : '已关闭') }}
            </span>
          </span>
        </span>

        <span class="sw-track"
              :style="controlOn[c.key] ? { backgroundColor: c.color } : {}">
          <span class="sw-thumb"></span>
        </span>
      </button>

      <div class="tip-area">
        <transition name="fade">
          <span v-if="tip[c.key]" class="tip-ok">
            <i class="fa fa-check-circle"></i> 指令已下发
          </span>
        </transition>
        <transition name="fade">
          <span v-if="tipErr[c.key]" class="tip-err">
            <i class="fa fa-exclamation-circle"></i> 下发失败（物模型里有这个属性吗？）
          </span>
        </transition>
      </div>

    </div>
  </section>

  <p class="footer-note">数据每 10 秒自动刷新 · 下发后自动回读状态 · 点击属性卡片查看历史曲线</p>

  <!-- ============ 历史数据弹窗 ============ -->
  <transition name="fade">
    <div v-if="hist.open" class="overlay" @click.self="closeHistory">
      <div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-head">
          <div style="min-width:0;">
            <h3 class="dialog-title">{{ hist.title }} · 历史数据</h3>
            <p class="dialog-sub">最近 24 小时</p>
          </div>
          <button type="button" class="dialog-close" @click="closeHistory" aria-label="关闭">
            <i class="fa fa-times"></i>
          </button>
        </div>

        <div class="dialog-body">
          <div class="chart-wrap">
            <div id="historyChart" class="chart"></div>
            <div v-if="hist.loading || hist.empty" class="chart-mask">
              <i class="fa" :class="hist.loading ? 'fa-spinner fa-spin' : 'fa-inbox'"></i>
              <span>{{ hist.loading ? '正在加载…' : hist.emptyText }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </transition>

  <!-- 语音：底部居中悬浮坞（拇指位，手机也好按） -->
  <div class="voice-dock">
    <div id="voiceCfg" class="voice-cfg" hidden>
      <div class="voice-cfg-head">语音设置</div>
      <div class="voice-cfg-row">
        <label for="voiceSel">音色</label>
        <select id="voiceSel"></select>
      </div>
      <div class="voice-cfg-row">
        <label for="voiceRate">语速</label>
        <input id="voiceRate" type="range" min="0.5" max="2" step="0.05" />
        <span class="voice-cfg-val" id="voiceRateVal"></span>
      </div>
      <div class="voice-cfg-row">
        <label for="voicePitch">音调</label>
        <input id="voicePitch" type="range" min="0" max="2" step="0.05" />
        <span class="voice-cfg-val" id="voicePitchVal"></span>
      </div>
      <div class="voice-cfg-row">
        <label for="voiceVol">音量</label>
        <input id="voiceVol" type="range" min="0" max="1" step="0.05" />
        <span class="voice-cfg-val" id="voiceVolVal"></span>
      </div>
      <div class="voice-cfg-foot">
        <button type="button" id="voiceTest" class="btn btn-outline btn-sm">试听</button>
        <span id="voiceHint" class="voice-cfg-hint"></span>
      </div>
      <div class="voice-cfg-tip">
        快捷键：<kbd>⌘</kbd>/<kbd>Ctrl</kbd> + <kbd>K</kbd> 开始 / 停止听；
        <kbd>Esc</kbd> 立刻停止
      </div>
    </div>

    <button type="button" id="voiceBtn" class="voice-fab"
            title="语音控制（⌘/Ctrl + K）：说“太热了”“打开灯 1”“温度多少”">
      <i class="fa fa-microphone"></i>
      <span id="voiceLabel">语音</span>
    </button>

    <button type="button" id="voiceCfgBtn" class="voice-gear" title="语音设置（音色 / 语速 / 音调）">
      <i class="fa fa-sliders"></i>
    </button>
  </div>

</div>

<script src="app.js"></script>
<script src="voice.js"></script>   <!-- 浏览器 ASR + 后端意图解析 -->

</body>
</html>
